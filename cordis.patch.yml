# dsh-tavily-search-plugin — bundle layer for the user's dsh profile.
#
# Loaded automatically when the package is installed into a profile (see
# `package.json` `dsh.bundle.patch`). Two entries:
#   1. `- insert:` installs the Tavily provider into the plugin table.
#   2. `- id: web config.searchProvider: tavily` pins the web seam to the
#      Tavily provider; without this pin, DSH throws `WEB_PROVIDER_AMBIGUOUS`
#      when both DeepSeek and Tavily are registered (see
#      `packages/web/web/src/index.ts` `resolveProvider`).
#
# To override defaults (e.g. a self-hosted Tavily proxy), add a second
# `- id: web-search-tavily config:` block. The host half reads these values
# on every search, so a restart is needed for host changes to take effect.
#
# Optional configuration keys for `id: web-search-tavily`:
#   apiKey:          literal Tavily API key (avoid committing)
#   apiKeyEnv:       credential reference name (default TAVILY_API_KEY)
#   baseURL:         endpoint base (default https://api.tavily.com)
#   searchDepth:     "basic" | "advanced" | "fast" | "ultra-fast" (default advanced)
#   maxResults:      integer 1-20 (default 7)
#   includeAnswer:   true | false (default false; the LLM answer reads like a stray result)
#   topic:           "general" | "news" | "finance" (default general)
#   days:            non-negative integer; limit to last N days (default 0 = no window; news topic only)
#   timeRange:       "day" | "week" | "month" | "year" | "d" | "w" | "m" | "y" (wins over days)
#   startDate:       "YYYY-MM-DD" (sources after this date)
#   endDate:         "YYYY-MM-DD" (sources before this date)
#   includeDomains:  domain list — restrict results INTO (max 300)
#   excludeDomains:  domain list — exclude from results (max 150)
#   chunksPerSource: integer 1-3 (default 1; short focused snippets)
#   useMcp:          true | false (default false; web_search hands off to mcp__tavily__* tools)

- insert:
    - id: web-search-tavily
      name: dsh-tavily-search-plugin
- id: web
  config:
    searchProvider: tavily
